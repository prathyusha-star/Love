
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chinnu, Will You Be Mine Forever?</title>
  <style>
    :root {
      --bg1: #ffe6f1; /* light pink */
      --bg2: #fff7fb; /* blush */
      --primary: #ff4d88;
      --primary-dark: #ff2d75;
      --accent: #ffd1dc;
      --text: #2b2b2b;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, var(--bg1), var(--bg2));
    }

    /* --- Romantic background layer with gradient shimmer & floating hearts --- */
    .romantic-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 143, 179, 0.18), transparent 40%),
        radial-gradient(circle at 70% 80%, rgba(255, 143, 179, 0.12), transparent 45%),
        linear-gradient(120deg, #fff7fb 0%, #ffe6f1 35%, #fff0f7 65%, #ffe6f1 100%);
      animation: glowShift 12s ease-in-out infinite alternate;
    }
    @keyframes glowShift {
      0%   { filter: hue-rotate(0deg) brightness(1); }
      100% { filter: hue-rotate(10deg) brightness(1.05); }
    }

    /* Floating heart bubbles */
    .heart-float {
      position: absolute;
      width: 22px; height: 22px;
      pointer-events: none;
      opacity: 0.7;
      transform: translate(-50%, -50%);
      animation: floatUp linear forwards;
    }
    .heart-shape {
      width: 100%; height: 100%;
      background: #ff6f9f;
      transform: rotate(-45deg);
      position: relative;
      filter: drop-shadow(0 4px 10px rgba(255, 77, 136, .25));
      border-radius: 4px;
    }
    .heart-shape::before, .heart-shape::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      background: #ff6f9f;
      border-radius: 50%;
    }
    .heart-shape::before { top: -50%; left: 0; }
    .heart-shape::after  { left: 50%; top: 0; }

    @keyframes floatUp {
      0%   { transform: translate(-50%, -50%) translateY(20px)  scale(0.9); opacity: 0; }
      10%  { opacity: 0.8; }
      100% { transform: translate(-50%, -50%) translateY(-120px) scale(1.1); opacity: 0; }
    }

    /* Content card */
    .wrap{position:relative;min-height:100%;display:grid;place-items:center;padding:24px}
    .card{
      position:relative;width:min(680px,92vw);
      background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);
      border-radius:24px;box-shadow:0 20px 60px rgba(255,77,136,.25),0 6px 18px rgba(0,0,0,.08);
      padding:28px 24px;text-align:center;border:2px solid var(--accent)
    }
    .hearts-bg::before{
      content:"";position:absolute;inset:-1px;border-radius:24px;pointer-events:none;
      background-image:
        radial-gradient(14px 10px at 20% 30%, rgba(255,77,136,.10) 40%, transparent 41%),
        radial-gradient(10px 8px at 80% 60%, rgba(255,77,136,.10) 40%, transparent 41%),
        radial-gradient(12px 9px at 60% 25%, rgba(255,77,136,.10) 40%, transparent 41%),
        radial-gradient(9px 7px at 30% 80%, rgba(255,77,136,.10) 40%, transparent 41%);
    }

    h1{font-size:clamp(24px,4.5vw,40px);line-height:1.2;margin:8px 0 10px;color:var(--primary-dark)}
    .subtitle{font-size:clamp(14px,2.6vw,18px);color:#555;margin-bottom:18px}
    .caption{min-height:24px;font-weight:600;color:var(--primary-dark);margin:6px 0 12px}

    .buttons{position:relative;height:220px;display:grid;place-items:center;margin-top:8px;overflow:visible}
    .btn{position:absolute;padding:14px 24px;border-radius:999px;border:none;background:var(--accent);color:#7a2a3b;font-weight:700;font-size:clamp(14px,2.8vw,18px);cursor:pointer;transition:transform .15s, box-shadow .15s, background .2s;box-shadow:0 8px 20px rgba(255,77,136,.25);user-select:none;touch-action:manipulation}
    .btn:active{transform:scale(.98)}
    .btn-yes{background:linear-gradient(180deg,#ff8fb3,#ff4d88);color:#fff;box-shadow:0 10px 24px rgba(255,77,136,.45)}
    .btn-yes:hover{filter:brightness(1.05)}
    .btn-no{background:#ffd5e0}

    .footer{margin-top:14px;font-size:13px;color:#7a7a7a}

    /* Modal */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:5}
    .modal.open{display:flex}
    .modal-card{background:#fff;border-radius:20px;width:min(560px,92vw);padding:22px 18px 26px;text-align:center;border:2px solid var(--accent);box-shadow:0 18px 40px rgba(0,0,0,.18)}
    .modal h2{color:var(--primary-dark);margin:10px 0 8px}
    .modal p{margin:4px 0 14px}
    .share-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .share-row a{padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:700;background:#f5f5f5;color:#333;border:1px solid #e8e8e8}

    /* Confetti canvas (global rain) */
    canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}

    /* Popper burst canvas (localized to Yes button) */
    canvas#popper{position:fixed;inset:0;pointer-events:none;z-index:11}

    /* Screen-reader live region */
    .sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}

    @media (max-width:420px){.buttons{height:240px}}
  </style>
</head>
<body>
  <!-- Romantic background layer -->
  <div class="romantic-bg" id="romanticBg"></div>

  <!-- Effects layers -->
  <canvas id="confetti"></canvas>
  <canvas id="popper"></canvas>

  <div class="wrap">
    <div class="card hearts-bg" id="card">
      <div class="sr-live" aria-live="polite" id="live"></div>
      <div class="subtitle" id="greeting">Hey there 💞</div>
      <h1 id="question">Will you be mine forever?</h1>
      <div class="caption" id="caption">Go on… choose wisely 😉</div>

      <div class="buttons" id="playground">
        <button id="yesBtn" class="btn btn-yes" style="left: 36%; top: 52%;">Yes 💖</button>
        <button id="noBtn" class="btn btn-no" style="left: 54%; top: 52%;">No 🙈</button>
      </div>

      <div class="footer">Made with love ✨</div>
    </div>
  </div>

  <div class="modal" id="yayModal" role="dialog" aria-modal="true" aria-labelledby="yayTitle">
    <div class="modal-card">
      <h2 id="yayTitle">Yaaay! 🎉💘</h2>
      <p id="yayText">You just made my heart the happiest!<br/>We’re officially a forever team. 🥰</p>
      <div class="share-row">
        <a id="shareWhatsApp" href="#" target="_blank" rel="noopener">Share on WhatsApp</a>
        <a id="shareMail" href="#">Tell me in an email</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Personalize via URL params: ?name=Alex&from=Kusuma
      const params = new URLSearchParams(location.search);
      const theirName = params.get('name');
      const fromName = params.get('from');
      const greeting = document.getElementById('greeting');
      const question = document.getElementById('question');

      if (theirName) greeting.textContent = `Hey ${theirName} 💞`;
      if (fromName) question.textContent = `Will you be mine forever, ${theirName ? theirName : 'love'}? – ${fromName}`;

      const captions = [
        "Oops… can't click that 😜",
        "Nuh-uh, only YES allowed!",
        "Hehe, missed me! 🐇",
        "Just press YES already 💖",
        "Destiny says No to No 😉",
        "Catch me if you can! 🏃‍♂️💨",
        "Spoiler: YES is the right answer ✨"
      ];

      const live = document.getElementById('live');
      const captionEl = document.getElementById('caption');
      const playground = document.getElementById('playground');
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const yayModal = document.getElementById('yayModal');
      const shareWA = document.getElementById('shareWhatsApp');
      const shareMail = document.getElementById('shareMail');

      let dodgeCount = 0;

      function setCaption(text) {
        captionEl.textContent = text;
        live.textContent = text; // announce for screen readers
      }

      function rand(min, max) { return Math.random() * (max - min) + min; }

      // ---- No button evasive behavior ----
      function moveNoButton() {
        const area = playground.getBoundingClientRect();
        const btn = noBtn.getBoundingClientRect();
        const maxLeft = area.width - btn.width - 6;
        const maxTop  = area.height - btn.height - 6;
        const newLeft = Math.max(3, Math.min(maxLeft, rand(0, maxLeft)));
        const newTop  = Math.max(3, Math.min(maxTop,  rand(0, maxTop)));
        noBtn.style.left = `${newLeft}px`;
        noBtn.style.top  = `${newTop}px`;

        const grow = Math.min(1 + dodgeCount * 0.06, 1.5);
        yesBtn.style.transform = `scale(${grow})`;
        setCaption(captions[dodgeCount % captions.length]);
        dodgeCount++;
      }

      function evade(e) { e.preventDefault(); e.stopPropagation(); moveNoButton(); }
      ['mouseenter','pointerenter','focus','pointerdown','touchstart'].forEach(evt => {
        noBtn.addEventListener(evt, evade, { passive: false });
      });

      playground.addEventListener('mousemove', (e) => {
        const n = noBtn.getBoundingClientRect();
        const threshold = 90; // px
        const dx = e.clientX - (n.left + n.width/2);
        const dy = e.clientY - (n.top  + n.height/2);
        const dist = Math.hypot(dx, dy);
        if (dist < threshold) moveNoButton();
      });

      // ---- Romantic floating hearts background ----
      const bg = document.getElementById('romanticBg');
      function spawnFloatingHearts() {
        for (let i = 0; i < 14; i++) {
          const d = document.createElement('div');
          d.className = 'heart-float';
          d.style.left = rand(6, 94) + '%';
          d.style.top  = rand(70, 100) + '%';
          d.style.opacity = rand(0.35, 0.9);
          d.style.animationDuration = rand(6, 11) + 's';
          d.style.animationDelay    = rand(0, 6) + 's';
          d.style.transform = `translate(-50%, -50%) scale(${rand(0.7, 1.3)})`;
          const shape = document.createElement('div');
          shape.className = 'heart-shape';
          shape.style.background = Math.random() < 0.5 ? '#ff6f9f' : '#ff8fb3';
          d.appendChild(shape);
          bg.appendChild(d);
          // Clean up after ~14s to avoid DOM growth
          setTimeout(() => d.remove(), 14000);
        }
      }
      spawnFloatingHearts();
      setInterval(spawnFloatingHearts, 12000);

      // ---- Confetti (global) ----
      const confettiCanvas = document.getElementById('confetti');
      const ctx = confettiCanvas.getContext('2d');
      let pieces = [], frame;

      // ---- Popper burst (local hearts & confetti near Yes button) ----
      const popCanvas = document.getElementById('popper');
      const popCtx = popCanvas.getContext('2d');

      function resize() {
        confettiCanvas.width = innerWidth;
        confettiCanvas.height = innerHeight;
        popCanvas.width = innerWidth;
        popCanvas.height = innerHeight;
      }
      addEventListener('resize', resize);
      resize();

      function makePiece() {
        const colors = ['#ff4d88', '#ff8fb3', '#ffd1dc', '#fff0f5', '#ffe3ed'];
        return {
          x: Math.random() * confettiCanvas.width,
          y: -10,
          w: rand(6, 10),
          h: rand(8, 14),
          r: rand(0, Math.PI * 2),
          s: rand(1, 2.5),
          v: rand(1.2, 2.4),
          c: colors[Math.floor(Math.random() * colors.length)]
        };
      }

      function launchConfetti(duration = 1500) {
        const start = performance.now();
        pieces = Array.from({ length: 160 }, makePiece);

        function draw(now) {
          const t = now - start;
          ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
          pieces.forEach(p => {
            p.y += p.v;
            p.x += Math.sin((p.y + now / 10) / 20) * p.s;
            p.r += 0.03;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.r);
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
          });
          if (t < duration) {
            frame = requestAnimationFrame(draw);
          } else {
            // brief fade
            frame = requestAnimationFrame(() => {
              ctx.globalAlpha = 0.96;
              ctx.fillStyle = 'rgba(255,255,255,0.1)';
              ctx.fillRect(0,0,confettiCanvas.width,confettiCanvas.height);
              ctx.globalAlpha = 1;
            });
          }
        }
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(draw);
      }

      // Localized burst (hearts + confetti) at screen coords (x, y)
      function popperBurst(x, y) {
        const particles = [];
        const colors = ['#ff2d75', '#ff6f9f', '#ffd1dc', '#ffffff'];
        const N = 42;
        for (let i = 0; i < N; i++) {
          const angle = (Math.PI * 2) * (i / N) + rand(-0.12, 0.12);
          const speed = rand(2.2, 4.2);
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - rand(0.2, 0.8),
            g: 0.06,
            life: rand(700, 1100),
            size: rand(6, 12),
            color: colors[Math.floor(Math.random()*colors.length)],
            heart: Math.random() < 0.35
          });
        }

        const start = performance.now();
        function draw(now) {
          const t = now - start;
          popCtx.clearRect(0, 0, popCanvas.width, popCanvas.height);

          // update
          particles.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; });

          // render
          particles.forEach(p => {
            const alpha = Math.max(0, 1 - t / p.life);
            popCtx.save();
            popCtx.globalAlpha = alpha;
            popCtx.translate(p.x, p.y);
            popCtx.rotate(Math.atan2(p.vy, p.vx));
            popCtx.fillStyle = p.color;
            if (p.heart) {
              drawHeart(popCtx, 0, 0, p.size, p.color);
            } else {
              popCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            }
            popCtx.restore();
          });

          if (t < 1200) requestAnimationFrame(draw);
          else popCtx.clearRect(0,0,popCanvas.width,popCanvas.height);
        }
        requestAnimationFrame(draw);
      }

      function drawHeart(ctx, x, y, s, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-Math.PI/4);
        ctx.fillStyle = color;
        const r = s * 0.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(-r/2, 0, r/2, Math.PI, 0);
        ctx.arc(0, -r/2, r/2, Math.PI/2, Math.PI*1.5);
        ctx.lineTo(0, 0);
        ctx.fill();
        ctx.restore();
      }

      // YES flow
      yesBtn.addEventListener('click', () => {
        setCaption('Knew it! Best decision ever 💗');
        launchConfetti();

        // Burst from the Yes button center
        const rect = yesBtn.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top  + rect.height / 2;
        popperBurst(x, y);

        setTimeout(() => yayModal.classList.add('open'), 350);

        const url = location.href.split('#')[0];
        const msg = encodeURIComponent(`I said YES to "Will you be mine forever?" ${fromName ? '– ' + fromName : ''} 💞\n${url}`);
        shareWA.href = `https://wa.me/?text=${msg}`;
        shareMail.href = `mailto:?subject=I said YES!&body=${msg}`;
      });

      // Close modal on background click
      yayModal.addEventListener('click', (e) => {
        if (e.target === yayModal) yayModal.classList.remove('open');
      });

      // Initial nudge
      setTimeout(() => setCaption('Go on… choose wisely 😉'), 600);
    })();
  </script>
</body>
</html>
